name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  create-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Request preview environment
        id: request
        env:
          EPHEMERA_TOKEN: ${{ secrets.EPHEMERA_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Ephemera verifies the repository, the pull request and this token's
          # owner against GitHub itself, so the request only needs to say
          # which PR. The head commit is passed so the deploy matches this run.
          body=$(jq -n --arg repo "$GITHUB_REPOSITORY" --argjson pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            '{repository_full_name: $repo, pr_number: $pr, commit_sha: $sha}')
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            https://ephemera-api.devpreview.app/api/v1/environments/ \
            -H "Authorization: Bearer $EPHEMERA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          code=$(printf '%s' "$response" | tail -n1)
          payload=$(printf '%s' "$response" | sed '$d')
          echo "HTTP $code"
          printf '%s\n' "$payload" | jq . 2>/dev/null || printf '%s\n' "$payload"
          if [ "$code" != "202" ]; then
            echo "Ephemera did not accept the request"
            exit 1
          fi
          echo "namespace=$(printf '%s' "$payload" | jq -r .namespace)" >> "$GITHUB_OUTPUT"
          echo "url=$(printf '%s' "$payload" | jq -r .environment_url)" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event.action != 'synchronize'
        uses: actions/github-script@v7
        env:
          NAMESPACE: ${{ steps.request.outputs.namespace }}
          ENV_URL: ${{ steps.request.outputs.url }}
        with:
          script: |
            const body = [
              '## Preview environment requested',
              '',
              `**URL**: ${process.env.ENV_URL}`,
              `**Namespace**: \`${process.env.NAMESPACE}\``,
              '',
              'Ephemera will comment again with the service links once the deployment is ready.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
