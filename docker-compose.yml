version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  app:
    image: python:3.11-alpine
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class PreviewHandler(BaseHTTPRequestHandler):
            def do_GET(self):
                body = b'<!doctype html><html lang="en"><meta charset="utf-8"><title>Ephemera preview test</title><h1>Hello from Ephemera!</h1><p>Preview update test: the second commit is live.</p></html>'
                self.send_response(200)
                self.send_header('Content-Type', 'text/html; charset=utf-8')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        HTTPServer(('0.0.0.0', 8000), PreviewHandler).serve_forever()
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=preview
