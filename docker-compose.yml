services:
  # The app in this repository, built by .github/workflows/preview-image.yml
  # for every commit. Ephemera substitutes the pull request's commit here.
  web:
    build: .
    image: ghcr.io/sabiut/ephemera-test-app:${EPHEMERA_SHA}
    ports:
      - "80:80"
    environment:
      - APP_ENV=preview

  # A stock image, not built from the pull request. Shows up as such in
  # Ephemera's setup check.
  echo:
    image: hashicorp/http-echo:1.0.0
    labels:
      ephemera.public: "false"
    command: ["-listen=:5678", "-text=stock image, not built from this repository"]
    ports:
      - "5678:5678"
