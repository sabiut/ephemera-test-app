version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  app:
    image: python:3.11-alpine
    command: python -m http.server 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=preview

  echo:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:5678", "-text=hello from the echo service, added in a pull request"]
    ports:
      - "5678:5678"
